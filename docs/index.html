<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Craft Budapest 2026 – Schedule</title>
<style>
  :root {
    --bg: #f8f9fa;
    --card: #ffffff;
    --border: #dee2e6;
    --accent: #0d6efd;
    --accent-light: #cfe2ff;
    --planned: #198754;
    --planned-light: #d1e7dd;
    --keynote: #6f42c1;
    --keynote-light: #e8d5ff;
    --workshop: #fd7e14;
    --workshop-light: #ffe5cc;
    --break-bg: #f1f3f5;
    --text: #212529;
    --muted: #6c757d;
    --radius: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  header { background: var(--accent); color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 1.2rem; font-weight: 700; }
  .header-meta { font-size: 0.8rem; opacity: .8; }

  .tabs { display: flex; background: #fff; border-bottom: 2px solid var(--border); padding: 0 20px; gap: 4px; }
  .tab { padding: 10px 18px; border: none; background: none; cursor: pointer; font-size: .9rem; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color .15s; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .controls { display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .controls label { display: flex; align-items: center; gap: 6px; font-size: .85rem; cursor: pointer; user-select: none; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: .75rem; font-weight: 600; }
  .pill.planned { background: var(--planned-light); color: var(--planned); }
  #planned-count { background: var(--planned-light); color: var(--planned); border-radius: 12px; padding: 2px 7px; font-size: .75rem; font-weight: 700; }

  /* ── DESKTOP GRID ── */
  .day-view { padding: 16px 20px; overflow-x: auto; }
  .grid-wrap { min-width: 0; }
  table.schedule { border-collapse: collapse; width: 100%; table-layout: fixed; }
  table.schedule th { background: var(--card); border: 1px solid var(--border); padding: 8px 6px; text-align: center; font-size: .8rem; font-weight: 700; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
  table.schedule th.time-col { width: 70px; }
  table.schedule td { border: 1px solid var(--border); padding: 0; vertical-align: top; }
  td.time-cell { text-align: center; font-size: .75rem; color: var(--muted); font-weight: 600; padding: 4px 2px; background: var(--bg); white-space: nowrap; }
  td.break-cell { background: var(--break-bg); text-align: center; color: var(--muted); font-size: .75rem; font-style: italic; padding: 4px; }
  td.empty-cell { background: var(--bg); }

  /* ── CARD ── */
  .card { background: var(--card); border-radius: var(--radius); padding: 8px; margin: 3px; box-shadow: var(--shadow); cursor: pointer; transition: box-shadow .15s; position: relative; }
  .card:hover { box-shadow: 0 3px 8px rgba(0,0,0,.14); }
  .card.planned { background: var(--planned-light); border-left: 3px solid var(--planned); }
  .card.keynote-type { background: var(--keynote-light); border-left: 3px solid var(--keynote); }
  .card.keynote-type.planned { background: var(--planned-light); }
  .card.workshop-type { background: var(--workshop-light); border-left: 3px solid var(--workshop); }
  .card.workshop-type.planned { background: var(--planned-light); }
  .card-type { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .card-type.keynote { color: var(--keynote); }
  .card-type.workshop { color: var(--workshop); }
  .card-type.talk { color: var(--accent); }
  .card-title { font-size: .82rem; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
  .card-title a { color: inherit; text-decoration: none; }
  .card-title a:hover { text-decoration: underline; }
  .card-speakers { font-size: .75rem; color: var(--muted); }
  .card-time { font-size: .7rem; color: var(--muted); margin-top: 3px; }
  .card-plan-btn { position: absolute; top: 6px; right: 6px; background: none; border: 1px solid var(--border); border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .card-plan-btn:hover { background: var(--accent-light); }
  .card.planned .card-plan-btn { background: var(--planned); border-color: var(--planned); color: #fff; }

  /* ── MOBILE (single column) ── */
  .mobile-view { display: none; padding: 12px; }
  .time-block { margin-bottom: 12px; }
  .time-label { font-size: .78rem; font-weight: 700; color: var(--muted); padding: 6px 0 4px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .break-card { background: var(--break-bg); border-radius: var(--radius); padding: 7px 10px; color: var(--muted); font-style: italic; font-size: .82rem; margin-bottom: 4px; }
  .stage-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }

  /* ── PLANNED VIEW ── */
  .planned-view { padding: 16px 20px; }
  .planned-empty { text-align: center; color: var(--muted); padding: 40px; }
  .planned-day { margin-bottom: 20px; }
  .planned-day h3 { font-size: .95rem; font-weight: 700; margin-bottom: 10px; color: var(--accent); border-bottom: 2px solid var(--accent-light); padding-bottom: 6px; }
  .planned-list { display: flex; flex-direction: column; gap: 8px; }

  @media (max-width: 700px) {
    .day-view { display: none; }
    .mobile-view { display: block; }
    header h1 { font-size: 1rem; }
  }
  @media (min-width: 701px) {
    .mobile-view { display: none; }
    .day-view { display: block; }
  }
</style>
</head>
<body>

<header>
  <h1>Craft Budapest 2026</h1>
  <div class="header-meta">June 4–5 · Hungarian Railway Museum</div>
</header>

<div class="tabs">
  <button class="tab active" onclick="showTab('day1')">Day 1 – Thu Jun 4</button>
  <button class="tab" onclick="showTab('day2')">Day 2 – Fri Jun 5</button>
  <button class="tab" onclick="showTab('planned')">My Plan <span id="planned-count">0</span></button>
</div>

<div class="controls">
  <label>
    <input type="checkbox" id="filter-planned" onchange="render()">
    Show only planned talks
  </label>
  <span id="legend" style="margin-left:auto; display:flex; gap:8px;">
    <span class="pill" style="background:var(--keynote-light);color:var(--keynote);">Keynote</span>
    <span class="pill" style="background:var(--workshop-light);color:var(--workshop);">Workshop</span>
    <span class="pill" style="background:var(--accent-light);color:var(--accent);">Talk</span>
    <span class="pill planned">✓ Planned</span>
  </span>
</div>

<div id="tab-day1" class="tab-content">
  <div class="day-view" id="desktop-day1"></div>
  <div class="mobile-view" id="mobile-day1"></div>
</div>
<div id="tab-day2" class="tab-content" style="display:none">
  <div class="day-view" id="desktop-day2"></div>
  <div class="mobile-view" id="mobile-day2"></div>
</div>
<div id="tab-planned" class="tab-content" style="display:none">
  <div class="planned-view" id="planned-view"></div>
</div>

<script src="schedule.js"></script>
</body>
</html>
